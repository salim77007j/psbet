name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build + tests + Vulkan + fuzz + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan software driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build (strict warnings = errors)
        run: cmake --build build -j"$(nproc)"

      - name: Probe Vulkan stack
        working-directory: build
        run: ./psbet gpu

      - name: Unit + integration tests (incl. Phase-3 guest suite)
        working-directory: build
        run: ./psbet_tests

      - name: RDNA subset corpus tests
        working-directory: build
        run: ./psbet_rdna_tests

      - name: Fuzzed guest corpus (kernel API + PBFF, deterministic)
        working-directory: build
        run: ./psbet_fuzz 64

      - name: Run cube demo (Vulkan backend) + capture screenshots
        working-directory: build
        run: |
          ./psbet run hello.elf
          # Frame limit (124) is the designed, controlled exit for the demo.
          rc=0
          ./psbet run cube.elf --backend vulkan --frames 90 \
              --screenshot-dir shots-vk --screenshot-interval 30 || rc=$?
          echo "psbet (vulkan) exit code: $rc"
          test "$rc" -eq 124

      - name: Run cube demo (software backend, reference) + screenshots
        working-directory: build
        run: |
          rc=0
          ./psbet run cube.elf --backend software --frames 90 \
              --screenshot-dir shots-sw --screenshot-interval 30 || rc=$?
          echo "psbet (software) exit code: $rc"
          test "$rc" -eq 124

      - name: Phase-3 live demo — GPU-VA draw path + container mount
        working-directory: build
        run: |
          ./psbet run cube_vm.elf --backend vulkan --frames 90 \
              --screenshot-dir shots-vm --screenshot-interval 30 || rc=$?
          echo "psbet (cube_vm, GPU virtual memory) exit code: $rc"
          test "$rc" -eq 124
          # app0 container mount through the VFS (psa pack + guest fs_demo).
          mkdir -p fsroot/docs
          echo "PSBET app0 container" > fsroot/manifest.txt
          echo "hello" > fsroot/docs/readme.md
          ./psbet mkfsa fsroot fsroot.psa
          ./psbet run fs_demo.elf --mount-pfs fsroot.psa --data-dir fsdata
          ./psbet run abi_probe.elf
          ./psbet run equeue_demo.elf
          ./psbet run syscall_probe.elf --syscall-trap on

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: psbet-linux-x64
          path: |
            build/psbet
            build/hello.elf
            build/cube.elf
            build/cube_vm.elf
            build/worker_exit.elf
            build/abi_probe.elf
            build/fs_demo.elf
            build/equeue_demo.elf
            build/syscall_probe.elf

      - name: Upload Vulkan demo screenshots
        uses: actions/upload-artifact@v4
        with:
          name: psbet-demo-screenshots-vulkan
          path: build/shots-vk/*.png

      - name: Upload software demo screenshots
        uses: actions/upload-artifact@v4
        with:
          name: psbet-demo-screenshots-software
          path: build/shots-sw/*.png

      - name: Upload GPU-VA demo screenshots
        uses: actions/upload-artifact@v4
        with:
          name: psbet-demo-screenshots-gpu-va
          path: build/shots-vm/*.png

      - name: Upload guest ELF images (for the Windows job)
        uses: actions/upload-artifact@v4
        with:
          name: psbet-guest-elves
          path: |
            build/hello.elf
            build/cube.elf
            build/cube_vm.elf
            build/worker_exit.elf
            build/abi_probe.elf
            build/fs_demo.elf
            build/equeue_demo.elf

  linux-asan:
    name: Linux ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan software driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Configure (sanitizers)
        run: >
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Tests under ASan/UBSan (guests stay non-instrumented)
        working-directory: build-asan
        run: >
          ../ci/lsan_wrap.sh ./psbet_tests

      - name: Fuzz corpus under ASan/UBSan
        working-directory: build-asan
        run: >
          ../ci/lsan_wrap.sh ./psbet_fuzz 16

  windows:
    name: Windows build + guest execution (ABI conformance)
    needs: linux          # ELF guest images are cross-built by the GCC toolchain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Core tests (memory, PNG, rasterizer, command executor, cache)
        working-directory: build
        run: Release\psbet_tests.exe

      # Phase 3: the Windows hosting shim runs the REAL ELF guest images
      # (built by the Linux job's GCC — guests are toolchain-independent:
      # PSBET itself is their "OS"). The Phase-2 thunk3 defect (arg2 lost on
      # every 3-argument call) is FIXED and regression-locked by abi_probe.
      # hello + worker_exit + abi_probe are HARD GATES now.
      - name: Download guest ELF images
        uses: actions/download-artifact@v4
        with:
          name: psbet-guest-elves
          path: guests

      - name: Run abi_probe.elf on Windows (ABI conformance — hard gate)
        working-directory: build
        timeout-minutes: 5
        run: |
          Release\psbet.exe run ..\guests\abi_probe.elf
          echo "exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run hello.elf on Windows (hard gate)
        working-directory: build
        timeout-minutes: 5
        run: |
          Release\psbet.exe run ..\guests\hello.elf
          echo "exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run worker_exit.elf on Windows (flaw-1 regression — hard gate)
        working-directory: build
        timeout-minutes: 5
        run: |
          Release\psbet.exe run ..\guests\worker_exit.elf
          echo "exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 7) { exit $LASTEXITCODE }

      # cube renders through the parked-thread exit path (frame limit);
      # kept diagnostic while the Windows park accounting is observed.
      - name: Run cube.elf on Windows + screenshots (diagnostic)
        working-directory: build
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "Release\psbet.exe" `
            -ArgumentList "run","..\guests\cube.elf","--frames","90",`
                          "--screenshot-dir","..\shots-win","--screenshot-interval","30" `
            -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { $p.Kill(); exit 124 }
          echo "exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 124) { exit $p.ExitCode }
          Get-ChildItem ..\shots-win

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: psbet-windows-x64
          path: |
            build/Release/psbet.exe
            build/Release/psbet_tests.exe

      - name: Upload Windows guest screenshots
        uses: actions/upload-artifact@v4
        with:
          name: psbet-demo-screenshots-windows
          path: shots-win/*.png
